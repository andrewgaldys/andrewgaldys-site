<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andrew Galdys | Real Estate Finance</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        bone: '#fbfbfa',
                        ink: '#111111',
                        charcoal: '#555555'
                    }
                }
            }
        }
    </script>

    <!-- Base Styles for Zero-Scroll Integrity -->
    <style>
        body {
            overscroll-behavior: none;
        }
    </style>
</head>
<!-- 
  Layout Engine: CSS Grid
  Mobile: 1 Column, 4 Rows (Images at top 30vh, Header, Nav, Footer)
  Desktop: 2 Columns, 3 Rows (Left side gets Header/Nav/Footer, Right side gets Images spanning all rows)
-->
<body class="bg-bone text-ink font-sans h-[100dvh] w-screen overflow-hidden grid grid-cols-1 grid-rows-[30vh_auto_1fr_auto] md:grid-cols-2 md:grid-rows-[auto_1fr_auto] box-border antialiased">
    
    <!-- 1. Header (Below Images on Mobile, Top-Left on Desktop) -->
    <header class="flex flex-col p-6 pb-2 md:p-16 md:pb-8 col-start-1 row-start-2 md:col-start-1 md:row-start-1 z-10">
        <h1 class="text-xl md:text-2xl font-medium tracking-wide text-ink">Andrew Galdys</h1>
        <p class="text-xs md:text-sm text-charcoal mt-1 md:mt-2 tracking-widest uppercase">Real Estate Finance</p>
    </header>

    <!-- 2. Navigation Links (Middle on Mobile, Middle-Left on Desktop) -->
    <main class="flex flex-col justify-center p-6 pt-2 md:p-16 md:pt-0 col-start-1 row-start-3 md:col-start-1 md:row-start-2 z-10">
        <nav class="flex flex-col space-y-4 md:space-y-10 items-start">
            <a href="about.html" class="text-3xl md:text-6xl font-medium tracking-tight text-ink hover:opacity-40 transition-opacity duration-300">About</a>
            <a href="models.html" class="text-3xl md:text-6xl font-medium tracking-tight text-ink hover:opacity-40 transition-opacity duration-300">Models</a>
            <a href="research.html" class="text-3xl md:text-6xl font-medium tracking-tight text-ink hover:opacity-40 transition-opacity duration-300">Research</a>
        </nav>
    </main>

    <!-- 3. Footer (Bottom on Mobile, Bottom-Left on Desktop) -->
    <footer class="flex flex-col-reverse xl:flex-row justify-between items-start xl:items-end p-6 pt-0 md:p-16 md:pt-0 col-start-1 row-start-4 md:col-start-1 md:row-start-3 text-xs md:text-sm text-charcoal w-full gap-y-3 z-10">
        <div class="flex flex-row space-x-6 md:space-x-6">
            <a href="mailto:hello@andrewgaldys.com" class="hover:text-ink hover:underline underline-offset-4 transition-all duration-300 tracking-wide">Email</a>
            <a href="https://linkedin.com/" target="_blank" rel="noopener noreferrer" class="hover:text-ink hover:underline underline-offset-4 transition-all duration-300 tracking-wide">LinkedIn</a>
        </div>
    </footer>

    <!-- 4. Image Gallery (Top on Mobile, Right Full-Height on Desktop) -->
    <div class="col-start-1 row-start-1 md:col-start-2 md:row-start-1 md:row-span-3 relative bg-ink overflow-hidden w-full h-full z-0" id="gallery-container">
        <img id="slide-a" src="bw1.jpg" class="absolute inset-0 w-full h-full object-cover transition-opacity duration-[1500ms] ease-in-out opacity-100">
        <img id="slide-b" src="bw2.jpg" class="absolute inset-0 w-full h-full object-cover transition-opacity duration-[1500ms] ease-in-out opacity-0">
    </div>

    <!-- JavaScript for 3-Second Image Rotation -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const images = [
                'bw1.jpg', 'bw2.jpg', 'bw3.jpg', 'bw4.jpg', 
                'bw5.jpg', 'bw6.jpg', 'bw7.jpg'
            ];
            
            let currentIndex = 0;
            const slideA = document.getElementById('slide-a');
            const slideB = document.getElementById('slide-b');
            let activeSlide = 'a'; 

            // Preload the next image to prevent network flickering
            const preload = new Image();
            preload.src = images[1];

            // Set rotation to 3000 milliseconds (3 seconds)
            setInterval(() => {
                currentIndex = (currentIndex + 1) % images.length;
                const nextImageSrc = images[currentIndex];

                if (activeSlide === 'a') {
                    slideB.src = nextImageSrc;
                    slideB.classList.remove('opacity-0');
                    slideB.classList.add('opacity-100');
                    slideA.classList.remove('opacity-100');
                    slideA.classList.add('opacity-0');
                    activeSlide = 'b';
                } else {
                    slideA.src = nextImageSrc;
                    slideA.classList.remove('opacity-0');
                    slideA.classList.add('opacity-100');
                    slideB.classList.remove('opacity-100');
                    slideB.classList.add('opacity-0');
                    activeSlide = 'a';
                }
            }, 3000); 
        });
    </script>
</body>
</html>
